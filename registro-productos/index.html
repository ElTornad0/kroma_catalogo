<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Registro de productos</title>
  <link rel="icon" href="favicon.ico">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="page">
    <div class="container">

      <!-- Encabezado -->
      <header class="header">
        <div class="header-icon" id="header-icon"></div>
        <div>
          <h1>Registro de productos</h1>
          <p class="subtitle" id="subtitle"></p>
        </div>
      </header>

      <!-- Formulario -->
      <form id="product-form" class="card form-card" autocomplete="off">
        <div class="form-top">
          <h2 id="form-title">Agregar producto</h2>
          <button type="button" id="cancel-btn" class="link-btn" hidden></button>
        </div>

        <div class="form-grid">
          <!-- Foto -->
          <label class="photo-box" id="photo-box">
            <span id="photo-placeholder"></span>
            <img id="photo-preview" alt="Vista previa" hidden>
            <input type="file" id="photo" accept="image/*">
          </label>

          <!-- Campos -->
          <div class="fields">
            <div class="field field-full">
              <label for="title">Título</label>
              <input id="title" required placeholder="Ej. Camiseta azul talla M">
            </div>

            <div class="field">
              <label for="cost">Costo</label>
              <input id="cost" type="number" step="0.01" min="0" required placeholder="0.00">
            </div>

            <div class="field">
              <label for="price">Valor de venta</label>
              <input id="price" type="number" step="0.01" min="0" required placeholder="0.00">
            </div>

            <div class="field">
              <label for="quantity">Cantidad</label>
              <input id="quantity" type="number" step="1" min="0" required placeholder="0">
            </div>

            <div class="field">
              <label for="category">Categoría</label>
              <input id="category" required placeholder="Ej. Electrónica" list="category-options">
              <datalist id="category-options"></datalist>
            </div>
          </div>
        </div>

        <p class="error" id="form-error" hidden></p>

        <button type="submit" class="btn-primary" id="submit-btn"></button>
      </form>

      <!-- Filtro por categoría -->
      <div class="filters" id="filters"></div>

      <!-- Lista de productos -->
      <div id="list"></div>

      <!-- Copia de seguridad -->
      <footer class="backup">
        <p>Los productos se guardan en este navegador. Para no perderlos, descargá una copia de vez en cuando.</p>
        <div class="backup-actions">
          <button type="button" class="btn-outline" id="export-btn">Descargar copia</button>
          <button type="button" class="btn-outline" id="import-btn">Restaurar copia</button>
          <input type="file" id="import-file" accept="application/json,.json" hidden>
        </div>
      </footer>

    </div>
  </div>

  <script src="js/app.js"></script>
</body>
</html>
